<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSPL Workforce</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #07152e, #123e75, #087e8b);
      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 32px 25px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fff;
      color: #123e75;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #dceaff;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      outline: none;
      font-size: 16px;
      background: #fff;
      color: #152238;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #f3bd4b;
      color: #14213d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #dceaff;
      font-size: 12px;
      line-height: 1.6;
    }

    #message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">TSPL</div>

    <h1>TSPL Workforce</h1>

    <p class="subtitle">
      Workforce Management System<br>
      Secure Employee Portal
    </p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your registered email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign In</button>
      <p id="message" role="status"></p>
    </form>

    <p class="note">
      Authorized users only.<br>
      TSPL Workforce Management
    </p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Login is not connected yet. Authentication setup is required.";
    });
  </script>
</body>
</html>
