<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5E97">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TSPL Workforce</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--blue:#0B5E97;--blue-d:#083F68;--blue-l:#E3F0FA;--orange:#F28C28;--bg:#F3F6FA;--card:#fff;--text:#1F2937;--muted:#6B7280;--line:#E5EAF0;--green:#1E8A4C;--green-l:#E4F4EA;--amber-l:#FDEFD9;--amber:#C26908;--red:#C0392B;--red-l:#FBE9E7;--violet:#5B4BC4;--violet-l:#EEEBFA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;color-scheme:light}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.hdr{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 64px;border-bottom:5px solid var(--orange)}
.hdr-top{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex:none}
.hdr small{opacity:.8;display:block;font-size:12.5px}
.hdr h1{margin:0;font-size:19px;font-weight:600}
.pad{padding:0 16px}
.lift{margin-top:-46px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#0F6FB0,var(--blue-d));color:#fff}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:700;letter-spacing:.2px;margin:2px 0 10px}
.hero .row{display:flex;gap:10px}
.hero .mini{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;font-size:12.5px}
.hero .mini b{display:block;font-size:15px;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--blue-l);color:var(--blue);font-weight:500}
.chip.ok{background:var(--green-l);color:var(--green)}.chip.off{background:var(--red-l);color:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:16px;padding:16px 10px;text-align:center;font-weight:600;font-size:14px}
.tile svg{width:30px;height:30px;display:block;margin:0 auto 6px}
.t-blue{background:var(--blue-l);color:var(--blue)}.t-green{background:var(--green-l);color:var(--green)}.t-amber{background:var(--amber-l);color:var(--amber)}.t-violet{background:var(--violet-l);color:var(--violet)}
.sec{font-size:14px;font-weight:600;color:var(--muted);margin:6px 2px 8px;letter-spacing:.3px;text-transform:uppercase}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.item:last-child{border-bottom:0}
.item .k{color:var(--muted)}.item .v{font-weight:600;text-align:right}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:12px;margin-top:2px;border-top:2px solid var(--line)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mico{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.mico svg{width:22px;height:22px}
.mrow .grow{flex:1}.mrow .amt{font-weight:700;color:var(--blue)}.mrow small{color:var(--muted);display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.mchip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:500;color:var(--muted)}
.mchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.top2{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px;display:flex;align-items:center;gap:8px}
.top2 h2{margin:0;font-size:20px}
.back{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.back svg{width:20px;height:20px}
.scr{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--blue);font-weight:600}
nav button.on svg{stroke:var(--blue)}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:112px;height:112px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#2E8FD0);border-radius:99px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--blue-d),var(--blue) 60%,#2E8FD0)}
.login .box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.login img{display:block;max-width:230px;width:70%;margin:0 auto 14px}
.login h2{text-align:center;margin:0 0 2px;font-size:20px;color:var(--blue-d)}
.login p.s{text-align:center;color:var(--muted);margin:0 0 16px;font-size:13.5px}
.fld{position:relative;margin-bottom:12px}
.fld input{width:100%;padding:14px 14px;border:1.5px solid var(--line);border-radius:12px;background:#F8FAFC;outline:none}
.fld input:focus{border-color:var(--blue);background:#fff}
.fld .eye{position:absolute;right:6px;top:6px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.fld .eye svg{width:22px;height:22px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6}
.btn.sec2{background:var(--blue-l);color:var(--blue)}
.btn.out{background:var(--red-l);color:var(--red)}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin:2px 2px 8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90%}
.demo{position:fixed;top:0;right:0;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-bottom-left-radius:10px;z-index:30}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.slip{background:#fff;border-radius:6px;padding:16px;border:1px solid var(--line)}
.slip h3{margin:0;text-align:center;color:var(--blue-d)}
.slip .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.slip table{width:100%;border-collapse:collapse;font-size:13.5px}
.slip td{padding:5px 4px;border-bottom:1px solid var(--line)}
.slip td:last-child{text-align:right}
.slip th{text-align:left;padding:6px 4px;background:var(--blue-l);color:var(--blue-d);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-bottom:10px}
.grid2 span{color:var(--muted)}
@media print{nav,.back,.noprint,.top2,.demo,.toast{display:none!important}body,#app{background:#fff}.scr{padding:0}.slip{border:0}}

.mw{position:relative;margin-left:auto;flex:none}
.menu-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.menu-btn svg{width:24px;height:24px}
.dd{position:absolute;right:0;top:44px;background:#fff;color:var(--text);border-radius:14px;box-shadow:0 8px 28px rgba(16,24,40,.22);min-width:190px;overflow:hidden;z-index:40}
.dd button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;text-align:left;font-weight:500}
.dd button svg{width:20px;height:20px}
.dd button+button{border-top:1px solid var(--line)}
.dd .lo{color:var(--red)}
textarea,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#F8FAFC;font:inherit;color:var(--text);outline:none;margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
textarea:focus,select:focus{border-color:var(--blue);background:#fff}
.attach{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attach label{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--blue-l);color:var(--blue);font-weight:600;cursor:pointer}
.attach label svg{width:18px;height:18px}
.attach span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{padding:12px 0;border-bottom:1px solid var(--line)}.tk:last-child{border-bottom:0}
.tk .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.tk .rep{background:var(--green-l);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.chip.st-open{background:var(--amber-l);color:var(--amber)}.chip.st-in_progress{background:var(--blue-l);color:var(--blue)}.chip.st-resolved{background:var(--green-l);color:var(--green)}
/* official payslip */
.os{background:#fff;border:1.5px solid #000;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.35}
.os .ttl{display:flex;align-items:center;gap:8px;padding:8px 8px 7px;border-bottom:1px solid #000}
.os .ttl img{width:82px;flex:none}
.os .ttl .c{flex:1;text-align:center}
.os .ttl h4{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.os .ttl h3{margin:2px 0 1px;font-size:14.5px;font-weight:700}
.os .ttl p{margin:0;font-size:10px;line-height:1.3}
.os .pe{padding:6px 8px;border-bottom:1px solid #000}
.os .pe small{display:block;font-size:10.5px}
.os .pe b{display:block;font-size:12px;margin:2px 0 3px}
.os table{width:100%;border-collapse:collapse}
.os td,.os th{padding:3px 8px;vertical-align:top;text-align:left}
.os .num{text-align:right}
.os .pd td{border-top:1px solid #000;border-bottom:1px solid #000;font-weight:700}
.os .hd th{border-bottom:1px solid #000;font-weight:700}
.os .sp td{height:34px}
.os .sep{border-left:1px solid #000}
.os .tot td{border-top:1px solid #000;font-weight:700}
.os .net td{font-weight:700}
.os-foot{text-align:center;font-size:10.5px;margin-top:6px;color:#444}
@media print{
 @page{size:A4;margin:16mm}
 .mw,.dd,.noprint,.top2,.demo,.toast,nav,.back{display:none!important}
 body,#app{background:#fff}.scr{padding:0!important}.pad{padding:0!important}
 .os{font-size:12.5px}.os .ttl img{width:118px}.os .ttl h4{font-size:14px}.os .ttl h3{font-size:17px}.os .ttl p{font-size:11px}.os .pe b{font-size:13.5px}
}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function titleCase(s){return String(s||"").toLowerCase().replace(/\b[a-z]/g,function(c){return c.toUpperCase();});}
function inr(n){return "Rs. "+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});}
function mlabel(d){var p=String(d).split("-");return MONTHS[+p[1]-1]+" "+p[0];}
function mshort(d){var p=String(d).split("-");return MONTHS[+p[1]-1].slice(0,3)+" "+p[0];}
function dlabel(d){if(!d)return "-";var p=String(d).split("-");return (+p[2])+" "+MONTHS[+p[1]-1].slice(0,3)+" "+p[0];}
function daysIn(d){var p=String(d).split("-");return new Date(+p[0],+p[1],0).getDate();}
function cur(){var r=S.rows.filter(function(x){return x.month===S.month;})[0];return r||S.rows[0]||null;}
function entries(o){return Object.keys(o||{}).map(function(k){return [k,Number(o[k])];}).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];});}

/* ---------- data from Supabase ---------- */
async function loadData(){
  var u=await sb.auth.getUser();
  if(!u.data||!u.data.user){return false;}
  var e=await sb.from("employees").select("*").eq("user_id",u.data.user.id).maybeSingle();
  var s=await sb.from("salary_details").select("*").order("month",{ascending:false});
  if(e.error||s.error){toast("Could not load data. Please try again.");}
  S.emp=e.data||null; S.rows=s.data||[]; S.month=S.rows.length?S.rows[0].month:null;
  return true;
}
async function doLogin(){
  var id=document.getElementById("lid").value.trim(), pw=document.getElementById("lpw").value;
  var err=document.getElementById("lerr"), btn=document.getElementById("lbtn");
  if(!id||!pw){err.textContent="Please enter your TSPL ID and password.";return;}
  var email=id.indexOf("@")>-1?id:id.toLowerCase()+"@example.com";
  btn.disabled=true;btn.textContent="Signing in...";err.textContent="";
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){err.textContent="Wrong TSPL ID or password.";btn.disabled=false;btn.textContent="Log in";return;}
  S.session=true; await loadData(); S.tab="home"; S.view=null; render();
}
async function doLogout(){ if(!DEMO){await sb.auth.signOut();} S.emp=null;S.rows=[];S.session=false;S.view=null;S.tab="home"; if(DEMO){demoData();} render(); }
async function doChangePw(){
  var a=document.getElementById("np1").value,b=document.getElementById("np2").value;
  if(a.length<8){toast("Password must be at least 8 characters.");return;}
  if(a!==b){toast("Passwords do not match.");return;}
  if(DEMO){toast("Demo mode: password not changed.");return;}
  var r=await sb.auth.updateUser({password:a});
  if(r.error){toast("Could not change password.");return;}
  S.pw=false; toast("Password changed."); render();
}

function compress(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var m=1280, k=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej();},"image/jpeg",0.72);
    };
    img.onerror=function(){rej();}; img.src=url;
  });
}
async function loadTickets(){
  if(DEMO){return;}
  var r=await sb.from("tickets").select("*").order("created_at",{ascending:false});
  if(!r.error){S.tickets=r.data||[];}
}
async function sendTicket(){
  var f=S.tf, msg=(f.msg||"").trim(), btn=document.getElementById("tbtn");
  if(msg.length<10){toast("Please describe your problem (at least 10 characters).");return;}
  btn.disabled=true; btn.textContent="Sending...";
  var path=null, e=S.emp||{};
  try{
    if(!DEMO&&S.file){
      var blob=await compress(S.file); path=e.employee_id+"/"+Date.now()+".jpg";
      var up=await sb.storage.from("tickets").upload(path,blob,{contentType:"image/jpeg"});
      if(up.error){throw up.error;}
    }
    var row={tspl_id:e.employee_id,category:f.cat,month:f.month||null,message:msg,image_path:path};
    if(DEMO){row.status="open";row.created_at=new Date().toISOString();S.tickets.unshift(row);}
    else{var ins=await sb.from("tickets").insert(row);if(ins.error){throw ins.error;}await loadTickets();}
    S.tf={cat:"Salary",month:"",msg:""}; S.file=null; toast("Ticket sent. We will reply here.");
  }catch(x){toast("Could not send the ticket. Please try again.");}
  render();
}
function render(){
  var app=document.getElementById("app"), h="";
  if(!DEMO&&!S.emp&&!S.rows.length&&!S.session){h=viewLogin();}
  else if(S.view&&S.view.v==="help"){h=viewHelp()+nav();}
  else if(S.view&&S.view.v==="slip"){h=viewSlip();}
  else{h=({home:viewHome,salary:viewSalary,slips:viewSlips,att:viewAtt,me:viewMe}[S.tab]||viewHome)()+nav();}
  app.innerHTML=(DEMO?'<div class="demo">DEMO</div>':'')+h;
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");
  if(!b){ if(S.menu){S.menu=false;render();} return; }
  var a=b.getAttribute("data-a");
  if(a==="menu"){S.menu=!S.menu;render();return;}
  S.menu=false;
  if(a==="login"){doLogin();}
  else if(a==="eye"){var i=document.getElementById("lpw");i.type=i.type==="password"?"text":"password";}
  else if(a==="tab"){S.tab=b.getAttribute("data-t");S.view=null;render();}
  else if(a==="home"){S.tab="home";S.view=null;render();}
  else if(a==="month"){S.month=b.getAttribute("data-m");render();}
  else if(a==="slip"){S.view={v:"slip",m:b.getAttribute("data-m")};render();}
  else if(a==="view"){S.view={v:b.getAttribute("data-v")};render(); if(S.view.v==="help"){loadTickets().then(render);}}
  else if(a==="back"){S.view=null;render();}
  else if(a==="pw"){S.pw=true;render();}
  else if(a==="savepw"){doChangePw();}
  else if(a==="logout"){doLogout();}
  else if(a==="print"){window.print();}
  else if(a==="ticket"){sendTicket();}
  else if(a==="rmfile"){S.file=null;render();}
});
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="tmsg"){S.tf.msg=ev.target.value;}
  else if(id==="tcat"){S.tf.cat=ev.target.value;}
  else if(id==="tmonth"){S.tf.month=ev.target.value;}
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="tfile"){
    var f=ev.target.files&&ev.target.files[0];
    if(f&&f.type.indexOf("image/")===0){S.file=f;render();}
    else if(f){toast("Please choose a photo or screenshot.");}
  }
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&document.getElementById("lbtn")){doLogin();}});

(async function start(){
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){try{navigator.serviceWorker.register("sw.js");}catch(x){}}
  if(DEMO){demoData();render();return;}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  var s=await sb.auth.getSession();
  if(s.data&&s.data.session){S.session=true;await loadData();}
  render();
})();
</script>
